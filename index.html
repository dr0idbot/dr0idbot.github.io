<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dr0idbot</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-text);
        background-color: var(--color-base);
        color: var(--color-text);
        min-height: 100vh;
        transition: background-color 0.3s, color 0.3s;
      }

      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        background-color: var(--color-mantle);
        border-bottom: 1px solid var(--color-surface-0);
      }

      .nav-inner {
        max-width: 72rem;
        margin: 0 auto;
        padding: var(--padding-sm) var(--padding-md);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .nav-title {
        font-size: var(--font-size-lg);
        font-weight: 600;
        color: var(--color-text);
        text-decoration: none;
      }

      .nav-title:hover {
        color: var(--color-mauve);
      }

      #theme-toggle {
        background: none;
        border: 1px solid var(--color-surface-1);
        border-radius: 9999px;
        padding: var(--padding-sm);
        cursor: pointer;
        color: var(--color-subtext-0);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.3s, border-color 0.3s;
      }

      #theme-toggle:hover {
        color: var(--color-peach);
        border-color: var(--color-peach);
      }

      #theme-toggle svg {
        width: 20px;
        height: 20px;
      }

      main {
        max-width: 72rem;
        margin: 0 auto;
        padding: calc(var(--padding-2xl) + 3rem) var(--padding-md) var(--padding-2xl);
      }

      .grid {
        max-width: 48rem;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
        gap: var(--gap-md);
      }

      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        background-color: var(--color-mantle);
        border: 1px solid var(--color-surface-0);
        border-radius: 12px;
        padding: var(--padding-lg);
        text-decoration: none;
        color: var(--color-text);
        transition: border-color 0.3s, background-color 0.3s;
      }

      .card:hover {
        border-color: var(--color-mauve);
        background-color: var(--color-crust);
      }

      .card-icon {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-overlay-1);
        margin-bottom: var(--gap-sm);
        transition: color 0.3s;
      }

      .card:hover .card-icon {
        color: var(--color-mauve);
      }

      .card-icon svg {
        width: 24px;
        height: 24px;
      }

      .card-title {
        font-size: var(--font-size-lg);
        font-weight: 600;
      }

      .card-desc {
        font-size: var(--font-size-sm);
        color: var(--color-subtext-0);
        margin-top: var(--gap-xs);
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-inner">
        <a href="/" class="nav-title">dr0idbot</a>
        <button id="theme-toggle" aria-label="Toggle theme">
          <i data-lucide="sun" id="theme-sun" style="display:none;"></i>
          <i data-lucide="moon" id="theme-moon"></i>
        </button>
      </div>
    </nav>

    <main>
      <div class="grid">
        <a href="p/pokedex.html" class="card">
          <div class="card-icon">
            <i data-lucide="folder"></i>
          </div>
          <div class="card-title">Pokedex</div>
          <div class="card-desc">Page One</div>
        </a>
      </div>
    </main>

    <script>
      lucide.createIcons();

      (function () {
        const html = document.documentElement;
        const toggle = document.getElementById('theme-toggle');
        const sun = document.getElementById('theme-sun');
        const moon = document.getElementById('theme-moon');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

        function setTheme(dark) {
          if (dark) {
            html.setAttribute('data-theme', 'dark');
            sun.style.display = '';
            moon.style.display = 'none';
          } else {
            html.setAttribute('data-theme', 'light');
            sun.style.display = 'none';
            moon.style.display = '';
          }
        }

        setTheme(prefersDark.matches);

        toggle.addEventListener('click', function () {
          var isDark = html.getAttribute('data-theme') === 'dark';
          setTheme(!isDark);
        });

        prefersDark.addEventListener('change', function (e) {
          setTheme(e.matches);
        });
      })();
    </script>
  </body>
</html>
