<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emolga #587</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
    --primary-1:#83F1C4;
    --primary-2:#53E9AD;
    --primary-3:#2CE299;
    --primary-4:#05DA84;
    --primary-5:#00B66C;

    --yellow-1:#FFEA8A;
    --yellow-2:#FFE25B;
    --yellow-3:#FFDB32;
    --yellow-4:#FFD306;
    --yellow-5:#FFD200;

    --purple-1:#CF88F0;
    --purple-2:#BB5AE8;
    --purple-3:#AA35E1;
    --purple-4:#980FD8;
    --purple-5:#7B05B2;

    --bg:#081713;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Inter,sans-serif;
    background:
        radial-gradient(circle at top right,var(--purple-4),transparent 35%),
        radial-gradient(circle at bottom left,var(--primary-4),transparent 30%),
        var(--bg);
    color:white;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
}

.card{
    width:min(1000px,100%);
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:32px;
    overflow:hidden;
    display:grid;
    grid-template-columns:1fr 1fr;
}

.visual{
    background:
        linear-gradient(145deg,var(--yellow-2),var(--yellow-4));
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px;
}

.visual img{
    width:100%;
    max-width:380px;
    filter:drop-shadow(0 30px 40px rgba(0,0,0,.25));
}

.content{
    padding:48px;
    display:flex;
    flex-direction:column;
    gap:28px;
}

.dex{
    font-family:"JetBrains Mono",monospace;
    color:var(--primary-2);
    font-size:.9rem;
}

h1{
    margin:0;
    font-size:3rem;
}

.subtitle{
    color:#d8d8d8;
    margin-top:10px;
}

.types{
    display:flex;
    gap:12px;
}

.type{
    padding:10px 16px;
    border-radius:999px;
    font-weight:600;
}

.electric{
    background:var(--yellow-3);
    color:#202020;
}

.flying{
    background:var(--purple-2);
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.info{
    background:rgba(255,255,255,.05);
    border-radius:18px;
    padding:18px;
}

.label{
    color:#bcbcbc;
    font-size:.85rem;
    margin-bottom:8px;
}

.value{
    font-size:1.1rem;
    font-weight:600;
}

.mono{
    font-family:"JetBrains Mono",monospace;
}

.stats{
    display:grid;
    gap:14px;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.bar{
    height:10px;
    border-radius:999px;
    background:rgba(255,255,255,.08);
    overflow:hidden;
    margin-top:8px;
}

.fill{
    height:100%;
    background:linear-gradient(90deg,var(--primary-2),var(--purple-2));
}

@media(max-width:850px){
    .card{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<div class="card">

    <div class="visual">
        <img
        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/587.png"
        alt="Emolga">
    </div>

    <div class="content">

        <div>
            <div class="dex">#0587</div>
            <h1>Emolga</h1>
            <div class="subtitle">Sky Squirrel Pokémon</div>
        </div>

        <div class="types">
            <div class="type electric">Electric</div>
            <div class="type flying">Flying</div>
        </div>

        <div class="grid">

            <div class="info">
                <div class="label">Height</div>
                <div class="value mono">0.4 m</div>
            </div>

            <div class="info">
                <div class="label">Weight</div>
                <div class="value mono">5.0 kg</div>
            </div>

            <div class="info">
                <div class="label">Ability</div>
                <div class="value">Static</div>
            </div>

            <div class="info">
                <div class="label">Hidden Ability</div>
                <div class="value">Motor Drive</div>
            </div>

        </div>

        <div>

            <h2>Base Stats</h2>

            <div class="stats">

                <div>
                    <div class="row">
                        <span>HP</span>
                        <span class="mono">55</span>
                    </div>
                    <div class="bar"><div class="fill" style="width:55%"></div></div>
                </div>

                <div>
                    <div class="row">
                        <span>Attack</span>
                        <span class="mono">75</span>
                    </div>
                    <div class="bar"><div class="fill" style="width:75%"></div></div>
                </div>

                <div>
                    <div class="row">
                        <span>Defense</span>
                        <span class="mono">60</span>
                    </div>
                    <div class="bar"><div class="fill" style="width:60%"></div></div>
                </div>

                <div>
                    <div class="row">
                        <span>Sp. Attack</span>
                        <span class="mono">75</span>
                    </div>
                    <div class="bar"><div class="fill" style="width:75%"></div></div>
                </div>

                <div>
                    <div class="row">
                        <span>Sp. Defense</span>
                        <span class="mono">60</span>
                    </div>
                    <div class="bar"><div class="fill" style="width:60%"></div></div>
                </div>

                <div>
                    <div class="row">
                        <span>Speed</span>
                        <span class="mono">103</span>
                    </div>
                    <div class="bar"><div class="fill" style="width:100%"></div></div>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
