<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dr0idbot</title>
    <link rel="stylesheet" href="styles/master.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="scripts/animations.js"></script>
  </head>
  <body>
    <nav>
      <div class="nav-inner">
        <a href="/" class="nav-title">dr0idbot</a>
        <button id="theme-toggle" aria-label="Toggle theme">
          <i data-lucide="sun" id="theme-sun" style="display:none;"></i>
          <i data-lucide="moon" id="theme-moon"></i>
        </button>
      </div>
    </nav>

    <main>
      <header class="hero-header">
        <h1 class="hero-title">dr0idbot</h1>
      </header>

      <div class="grid">
        <a href="p/pokedex.html" class="card">
          <div class="card-icon">
            <i data-lucide="folder"></i>
          </div>
          <div class="card-title">Pokedex</div>
          <div class="card-desc">Random Pokémon Picker &amp; Detailed Stats</div>
        </a>

        <a href="p/movies.html" class="card">
          <div class="card-icon">
            <i data-lucide="film"></i>
          </div>
          <div class="card-title">Movies &amp; Shows</div>
          <div class="card-desc">Favorite Movies &amp; Animated Series</div>
        </a>
      </div>
    </main>

    <script src="scripts/index.js"></script>
  </body>
</html>
