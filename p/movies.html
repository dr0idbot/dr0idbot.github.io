<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies & Shows - dr0idbot</title>
  <link rel="stylesheet" href="../styles/master.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="../scripts/animations.js"></script>
</head>
<body>
  <div class="subpage-top-bar">
    <a href="../index.html" class="back-btn">
      <i data-lucide="arrow-left"></i>
      <span>Back</span>
    </a>
    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
      <i data-lucide="sun" id="theme-sun" style="display:none;"></i>
      <i data-lucide="moon" id="theme-moon"></i>
    </button>
  </div>

  <main class="movies-container">
    <header class="movies-header">
      <h1 class="movies-title">Movies & Shows</h1>
      <p class="movies-subtitle">My curated collection of favorite movies and animated series</p>
    </header>

    <section class="movies-controls">
      <div class="filter-tabs">
        <button class="tab-btn active" data-category="all">All</button>
        <button class="tab-btn" data-category="movie">Movies</button>
        <button class="tab-btn" data-category="series">TV Series</button>
      </div>

      <div class="movies-search">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" id="movies-search-input" placeholder="Search title or year...">
      </div>
    </section>

    <div id="movies-grid" class="movies-grid">
      <!-- Movie cards rendered dynamically -->
    </div>
  </main>

  <footer>
    <p>Ratings listed here reflect personal recommendations (not official ratings).</p>
  </footer>

  <script src="../scripts/movies.js"></script>
</body>
</html>
